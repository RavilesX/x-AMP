name: release

# Driven by the tag, so cutting a release is "git tag v1.0.0 && git push --tags".
# workflow_dispatch is there to rehearse one without publishing: without a tag
# the job builds and packages, then stops short of creating the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload to it

jobs:
  # The source tarball, and the version guard every other job trusts.
  source:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git archive and the changelog need the full history

      # The version lives in src/qmmp/qmmp.h and nowhere else -- CMake parses
      # that header. A tag that disagrees with it would ship a tarball whose
      # About dialog reports a different version from the release it sits in,
      # which is the kind of thing nobody notices until a bug report is
      # unreproducible. Cheapest possible guard, so it runs first.
      - name: Check the tag matches the version in the source
        id: version
        run: |
          v() { grep -Po "#define QMMP_VERSION_$1\s+\K[0-9]+" src/qmmp/qmmp.h; }
          version="$(v MAJOR).$(v MINOR).$(v PATCH)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in qmmp.h: $version"

          if [ "$(v STABLE)" != "1" ]; then
            echo "::error::QMMP_VERSION_STABLE is 0, so the version string would" \
                 "carry a -dev suffix. Set it to 1 before tagging a release."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match qmmp.h ($version)."
              exit 1
            fi
            echo "Tag matches."
          else
            echo "Manual run, no tag to check against."
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-multimedia-dev libgl1-mesa-dev \
            libtag1-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libogg-dev libvorbis-dev libflac-dev \
            libmad0-dev libmpg123-dev libopus-dev libopusfile-dev \
            libsndfile1-dev libwavpack-dev libmpcdec-dev libgme-dev \
            libsidplayfp-dev libxmp-dev libfaad-dev libwildmidi-dev \
            libarchive-dev libcurl4-openssl-dev libmms-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev libcddb2-dev \
            libshout3-dev libsoxr-dev libbs2b-dev libenca-dev \
            libprojectm-dev ladspa-sdk libx11-dev libxcb1-dev \
            desktop-file-utils appstream

      # Publishing a tarball that does not compile is the one failure mode
      # worth spending runner minutes to rule out, so the release build is a
      # full one, not a smoke test.
      - name: Configure
        run: cmake -B build 2>&1 | tee configure.log

      - name: Check for plugin regressions
        run: ./ci/plugin-summary.sh configure.log

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Staged install
        run: |
          make -C build install/strip DESTDIR="$PWD/stage"
          desktop-file-validate stage/usr/local/share/applications/*.desktop
          appstreamcli validate --no-net \
            stage/usr/local/share/metainfo/io.github.ravilesx.xamp.metainfo.xml

      # git archive rather than tar of the working tree: it takes exactly what
      # is committed, honours .gitattributes, and cannot pick up build output
      # or a stray file someone left lying around.
      - name: Build the source tarball
        run: |
          name="x-amp-${VERSION}"
          git archive --format=tar --prefix="${name}/" "${GITHUB_SHA}" \
            | gzip -9 > "${name}.tar.gz"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "TARBALL=${name}.tar.gz" >> "$GITHUB_ENV"
          ls -l "${name}.tar.gz"

      # Proves the tarball is self-contained: it is unpacked somewhere else and
      # configured from scratch. A file missing from git but present locally
      # dies here rather than in a user's first build.
      - name: Check the tarball configures on its own
        run: |
          work="$(mktemp -d)"
          tar -xzf "${TARBALL}" -C "$work"
          cmake -S "$work/x-amp-${VERSION}" -B "$work/build" > /dev/null
          echo "The tarball configures standalone."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: |
            x-amp-*.tar.gz
            x-amp-*.tar.gz.sha256
          retention-days: 14

    outputs:
      version: ${{ steps.version.outputs.version }}

  # The same build the CI runs, through the same composite action, plus the
  # packaging the release needs: a portable zip and an installer.
  windows:
    # After the source job rather than beside it: that job holds the guard
    # that the tag and qmmp.h agree, and packaging Windows for twenty minutes
    # before finding out they do not is runner time spent on nothing.
    needs: source
    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/windows-build

      # Inno Setup rather than NSIS or CPack. The staged tree already starts on
      # its own, so all the installer does is carry a directory, and a single
      # .iss says that in a form someone can read and run by hand. Pinned so a
      # new Inno release cannot change the wizard under a future tag.
      - name: Install Inno Setup
        run: choco install innosetup --version=6.2.2 -y --no-progress

      - name: Package
        run: |
          version="${{ needs.source.outputs.version }}"
          mkdir -p dist

          # Portable: the staged tree as it stands, for anyone who would
          # rather not run an installer or wants it on a stick.
          portable="x-amp-${version}-windows-x64"
          cp -r stage "$portable"
          7z a -tzip -mx=9 "dist/${portable}.zip" "$portable" > /dev/null

          # Installed: the wizard. iscc is not on PATH after choco.
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" \
            "/DAppVersion=${version}" \
            "/DStageDir=$(pwd -W)\\stage" \
            "/DSourceRoot=$(pwd -W)" \
            "/DOutputDir=$(pwd -W)\\dist" \
            packaging/windows/xamp.iss

          # Both are what the release page offers, so a missing one has to
          # fail here rather than produce a release with half its assets.
          setup="dist/x-amp-${version}-setup.exe"
          [ -f "$setup" ] || { echo "::error::The installer was not produced."; exit 1; }
          ( cd dist && sha256sum "${portable}.zip" > "${portable}.zip.sha256" \
                    && sha256sum "x-amp-${version}-setup.exe" > "x-amp-${version}-setup.exe.sha256" )
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*
          retention-days: 14

  # Publishing is its own job so it cannot run until both builds are green: a
  # release whose Windows asset is missing is worse than one that is late.
  publish:
    needs: [source, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      # gh is preinstalled on the runner, so no third-party action gets a token.
      # --verify-tag refuses to invent a tag that is not really there.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          find assets -type f | sort
          notes="$(mktemp)"
          {
            echo "## x-AMP ${VERSION}"
            echo
            echo "Built and packaged from \`${GITHUB_SHA}\`."
            echo
            echo "### Windows"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| \`x-amp-${VERSION}-setup.exe\` | Installer. Per-user by default, so no administrator prompt. |"
            echo "| \`x-amp-${VERSION}-windows-x64.zip\` | Portable: unpack and run \`bin\\xamp.exe\`. |"
            echo
            echo "Windows 10 or newer, 64-bit. Both carry the Qt and MinGW"
            echo "runtimes and every decoder plugin, so nothing else is needed."
            echo
            echo "### Linux, from source"
            echo
            echo '```sh'
            echo "tar -xzf x-amp-${VERSION}.tar.gz"
            echo "cd x-amp-${VERSION}"
            echo 'cmake -B build && make -C build -j"$(nproc)"'
            echo 'sudo make -C build install/strip && sudo ldconfig'
            echo '```'
            echo
            echo "Requires Qt 6.2 or newer and taglib; every other dependency is"
            echo "optional and decides which plugins get built. The configure"
            echo "summary lists what was enabled."
            echo
            echo "x-AMP is a fork of [Qmmp](https://qmmp.ylsoftware.com/) by Ilya"
            echo "Kotov and the Qmmp Development Team, and installs alongside it"
            echo "rather than over it."
          } > "$notes"

          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "x-AMP ${VERSION}" \
            --notes-file "$notes" \
            --repo "${GITHUB_REPOSITORY}" \
            $(find assets -type f | sort)
