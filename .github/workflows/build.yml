name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch supersedes the first; no point burning
# runner minutes on a build nobody will look at.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than ubuntu-latest: the compiler version decides which
    # warnings appear, and this matches the development machine (GCC 13).
    runs-on: ubuntu-24.04

    # The implicit shell is "bash -e", without pipefail, which would let a
    # failing cmake or make pass because tee exits 0. "shell: bash" is
    # "bash -eo pipefail".
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-multimedia-dev libgl1-mesa-dev \
            libtag1-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libogg-dev libvorbis-dev libflac-dev \
            libmad0-dev libmpg123-dev libopus-dev libopusfile-dev \
            libsndfile1-dev libwavpack-dev libmpcdec-dev libgme-dev \
            libsidplayfp-dev libxmp-dev libfaad-dev libwildmidi-dev \
            libarchive-dev libcurl4-openssl-dev libmms-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev libcddb2-dev \
            libshout3-dev libsoxr-dev libbs2b-dev libenca-dev \
            libprojectm-dev ladspa-sdk libx11-dev libxcb1-dev \
            desktop-file-utils appstream

      - name: Configure
        run: cmake -B build 2>&1 | tee configure.log

      # x-AMP has no test suite, so this is the main regression guard: a
      # change in libqmmp can silently disable a distant plugin, and a
      # missing dependency only ever shows up here.
      - name: Check for plugin regressions
        run: ./ci/plugin-summary.sh configure.log

      - name: Build
        run: make -C build -j"$(nproc)" 2>&1 | tee build.log

      # Reported, not enforced: -Werror would turn every upstream merge into a
      # blocked build over warnings that are not ours to fix. The tree built
      # warning-free when this was set up, so any number here is worth reading.
      - name: Report compiler warnings
        run: |
          count=$(grep -c 'warning:' build.log 2>/dev/null || true)
          count=${count:-0}
          {
            echo "### Compiler warnings: $count"
            if [ "$count" -gt 0 ]; then
              echo
              echo '```'
              # head closes the pipe early, which hands sort a SIGPIPE; under
              # pipefail that would fail this step the first time a warning
              # ever appears, which is precisely when the report is wanted
              grep 'warning:' build.log | sort -u | head -50 || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Catches the class of bug that broke phase 2: install() rules whose
      # source file does not exist. It never shows up in a plain build.
      - name: Staged install
        run: |
          make -C build install DESTDIR="$PWD/stage"
          echo "Installed files: $(find stage -type f -o -type l | wc -l)"
          # Nothing installed may be named plain "qmmp*": that is what would
          # collide with the upstream package. Internal artefacts carry the
          # -xamp suffix, user-facing ones are named xamp.
          strays=$(find stage -type f -o -type l | grep -E '/qmmp[^/]*$' | grep -v -- '-xamp' || true)
          if [ -n "$strays" ]; then
            echo "Unsuffixed files that would collide with upstream qmmp:"
            echo "$strays"
            exit 1
          fi
          echo "No colliding file names."

      # appstreamcli exits non-zero on warnings, not just errors, so this step
      # is stricter than it looks. That is deliberate: the metadata is small
      # and the fork's AppStream identity is worth keeping exactly right.
      - name: Validate desktop entries and AppStream metadata
        run: |
          # The solid/actions entry is a KDE Solid action (Type=Service), not
          # a standard desktop entry; desktop-file-validate rejects it both
          # here and upstream, so it is deliberately not checked.
          desktop-file-validate stage/usr/local/share/applications/*.desktop
          appstreamcli validate --no-net \
            stage/usr/local/share/metainfo/io.github.ravilesx.xamp.metainfo.xml

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            configure.log
            build.log
          retention-days: 14

  # Windows is not a platform x-AMP is released for, but the tree carries a
  # good deal of Windows-only code -- the named-pipe IPC, the taskbar and
  # rdetect plugins, the .rc the executable embeds -- and none of it is
  # exercised by the Linux job. Without this, that code can rot for months
  # unnoticed. Failures here are worth reading, not worth blocking on.
  windows:
    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # MinGW, not MSVC. The equalizer core carries __attribute__((aligned)) on
      # every coefficient table (src/qmmp/equ/iir_cfs.c), which is GCC syntax
      # MSVC does not accept at all -- upstream builds Windows with MinGW and
      # the code says so. Qt's own MinGW build has to be matched by the same
      # compiler that produced it, hence 6.8.3 against the 13.1.0 toolchain.
      #
      # aqtinstall rather than a Qt action from the marketplace: it is one pip
      # package and no third-party workflow gets a look at the job. qttools,
      # which carries lrelease and the Qt6LinguistTools CMake package the
      # configure step insists on, ships inside the base archive -- no extra
      # module needed.
      - name: Install Qt and the MinGW toolchain
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_mingw \
            --outputdir "$RUNNER_TEMP/Qt"
          python -m aqt install-tool windows desktop tools_mingw1310 \
            qt.tools.win64_mingw1310 --outputdir "$RUNNER_TEMP/Qt"
          echo "QT_ROOT=$RUNNER_TEMP/Qt/6.8.3/mingw_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/Qt/Tools/mingw1310_64/bin" >> "$GITHUB_PATH"

      # Ninja rather than "MinGW Makefiles": this job runs its steps through
      # Git bash, so sh.exe is on PATH, and that generator refuses to run when
      # it is. pkg-config finds nothing here and is meant to -- but
      # src/plugins/CMakeLists.txt calls pkg_search_module unconditionally, and
      # FindPkgConfig answers a missing tool with SEND_ERROR, which stops CMake
      # from generating at all.
      - name: Install pkg-config and Ninja
        run: |
          choco install pkgconfiglite -y --no-progress --allow-empty-checksums
          choco install ninja -y --no-progress

      # The compilers are named explicitly: Visual Studio is present on the
      # runner, so CMake would otherwise pick cl.exe and undo the point of
      # installing MinGW at all.
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" 2>&1 | tee configure-windows.log

      # Only Qt is present, so the interfaces and the Windows-only plugins are
      # what actually gets compiled. That is the code this job exists for.
      #
      # Reporting only. Every filter here ends in "|| true": grep exits 1 when
      # it matches nothing, and under "bash -eo pipefail" that failure sinks
      # the step and skips the build behind it -- which is exactly what
      # happened on this job's first run, where the summary lines did not have
      # the shape the filter expected and nothing was ever compiled.
      - name: Report what was enabled
        continue-on-error: true
        run: |
          {
            echo "### Windows configure summary"
            echo '```'
            grep -E '\.{3,}|^-- ' configure-windows.log | tail -60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: cmake --build build --parallel 2>&1 | tee build-windows.log

      # The .rc is the one file no other job can check: it is only ever fed to
      # a resource compiler here, and it is generated from qmmp.h, so a version
      # bump can break it without anyone touching it.
      - name: Check the executable and its resources
        run: |
          exe=$(find build -name 'xamp.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "::error::xamp.exe was not produced."
            exit 1
          fi
          echo "Built $exe"
          rc="build/src/app/qmmp.rc"
          if [ ! -f "$rc" ]; then
            echo "::error::qmmp.rc was never configured from qmmp.rc.in."
            exit 1
          fi
          v() { grep -Po "#define QMMP_VERSION_$1\s+\K[0-9]+" src/qmmp/qmmp.h; }
          want="$(v MAJOR),$(v MINOR),$(v PATCH),0"
          if ! grep -qF "$want" "$rc"; then
            echo "::error::The resource script says $(grep -m1 FILEVERSION "$rc") but qmmp.h says $want."
            exit 1
          fi
          echo "Resource version matches qmmp.h: $want"

      - name: Report compiler warnings
        if: always()
        run: |
          count=$(grep -cE 'warning:' build-windows.log 2>/dev/null || true)
          count=${count:-0} # the log is missing entirely when the build was skipped
          {
            echo "### MinGW warnings: $count"
            if [ "$count" -gt 0 ]; then
              echo
              echo '```'
              grep -E 'warning:' build-windows.log | sort -u | head -50 || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: |
            configure-windows.log
            build-windows.log
          retention-days: 14
